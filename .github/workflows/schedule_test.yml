name: Automatic Schedule Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check automatic trigger
        run: |
          echo "GitHub automatic scheduler is working!"
          echo "Event: ${{ github.event_name }}"
          date -u
