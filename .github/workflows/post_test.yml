name: YouTube Automation Promo Instagram Publisher

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: 'Publish to Instagram now?'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'
  schedule:
    # 07:00, 10:00, 13:00, 16:00, 19:00, 22:00 IST (best effort)
    - cron: '30 1,4,7,10,13,16 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-promo-publisher
  cancel-in-progress: false

jobs:
  prepare-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install pillow requests

      - name: Prepare numbered promotional image and caption
        run: python promo_generator.py

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: youtube-promo-preview
          path: output/
          retention-days: 3

      - name: Check Instagram quota
        if: ${{ github.event_name == 'schedule' || inputs.publish_now == 'yes' }}
        id: quota
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CHECK_SCHEDULE_HOURS: 'false'
        run: python check_quota.py

      - name: Explain why Instagram publishing was skipped
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_now != 'yes') || steps.quota.outputs.allowed != 'true' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_now }}" != "yes" ]; then
            echo "::warning::Preview only: publish_now was NO. Choose YES for a real Instagram post."
            echo "### Preview only — no Instagram post was attempted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Instagram publishing was blocked by the quota/authentication check. Inspect the Check Instagram quota step. Confirm IG_ACCESS_TOKEN is configured and valid."
            echo "### Instagram publishing blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the quota/authentication step. The run is intentionally marked failed so a green tick never falsely implies a successful post." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Host numbered image in public GitHub repository
        if: ${{ steps.quota.outputs.allowed == 'true' }}
        run: |
          set -euo pipefail
          folder="posts/promo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$folder"
          cp output/promo_post.jpg "$folder/promo_post.jpg"
          git add "$folder/promo_post.jpg"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Host numbered YouTube promo image"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Publish photo on Instagram
        if: ${{ steps.quota.outputs.allowed == 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts/promo-${{ github.run_id }}-${{ github.run_attempt }}/promo_post.jpg
        run: python publish_promo.py

      - name: Advance counter only after confirmed publish
        if: ${{ steps.quota.outputs.allowed == 'true' && success() }}
        run: |
          set -euo pipefail
          cp output/post_number.txt post_counter.txt
          git add post_counter.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Advance published promo post number"
          git push origin "HEAD:${GITHUB_REF_NAME}"
